[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "Prism — semantic exploration and model-development tool for structured divergence, synthesis, and adversarial critique"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
prism = "prism.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"prism.slice" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
